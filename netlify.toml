[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/trains"
  to = "/.netlify/functions/trains"
  status = 200

[[redirects]]
  from = "/api/route"
  to = "/.netlify/functions/route"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
